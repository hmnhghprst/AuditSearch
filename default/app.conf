#
# app.conf — AuditSearch
#
[install]
is_configured = 0
state = enabled

[ui]
is_visible = 0
label = AuditSearch

[launcher]
author = Hoomaan Haghparast
version = 1.1.0
description = Search-time interpreter/decoder for raw Linux auditd logs. Adds an \
    `auditsearch` SPL command that resolves arch codes, syscall numbers, hex-encoded \
    fields (e.g. PROCTITLE) and errno exit codes at search time, without touching \
    ingestion (props.conf/transforms.conf) or the source hosts.

[package]
id = auditsearch
check_for_updates = 1
