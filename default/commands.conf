#
# commands.conf — AuditSearch
#
# `auditsearch` is a search-time-only custom streaming command. It is invoked
# per search, reads events already in the pipeline, and never touches the
# index, props.conf/transforms.conf field extraction, or the source hosts.
#
# chunked=true selects the modern (SCP v2) chunked protocol, which is the
# currently recommended transport for custom search commands and required
# to declare command type via splunklib's @Configuration() decorator instead
# of hard-coding it here.
#
[auditsearch]
filename = auditsearch.py
chunked = true
python.version = python3

# Legacy (SCP v1) hints, harmless under chunked=true, kept for older
# Splunk versions / introspection tools that still read them:
type = python
streaming = true
retainsevents = true
run_in_preview = true
supports_multivalues = false

# The command reads only the fields already present on each event
# (principally _raw); it makes no outbound calls and requires no
# elevated Splunk session, so we do not request srinfo.
requires_srinfo = false
